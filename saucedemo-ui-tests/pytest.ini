[pytest]
testpaths = tests
pythonpath = .
addopts = -v --strict-markers --alluredir=reports/allure-results --clean-alluredir
markers =
    smoke: quick checks of the main user flows
    regression: wider functional coverage
    the_internet: scenarios on the-internet.herokuapp.com
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
